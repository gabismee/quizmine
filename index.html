<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-f68b538a-d9c5-4d6f-9e8c-ef5e8102c92b/styles.css">
<script src="_ds/organic-f68b538a-d9c5-4d6f-9e8c-ef5e8102c92b/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)}a{color:var(--color-accent-700)}a:hover{color:var(--color-accent-800)}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:clamp(12px,4vw,var(--space-6)) clamp(10px,3vw,var(--space-3));box-sizing:border-box;position:relative;background:url('assets/fundo-quiz.png') center/cover">
  <div style="width:100%;max-width:820px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;gap:var(--space-4);padding:clamp(20px,5vw,48px) clamp(16px,4.5vw,40px);border-radius:clamp(20px,4vw,calc(var(--radius-lg) * 1.5));background:color-mix(in srgb, var(--color-bg) 90%, transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow-lg)">

    <sc-if value="{{ isIntro }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;gap:var(--space-3)">
        <h1 style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:clamp(32px,7vw,56px);line-height:1.05;margin:0;text-wrap:pretty">qual mob vc seria com base na sua personalidade?</h1>
        <div style="width:100%;aspect-ratio:16/9;border-radius:calc(var(--radius-lg) * 1.15);overflow:hidden;box-shadow:var(--shadow-md)"><image-slot id="capa-quiz-campo" src="assets/capa-mobs-campo.png" shape="rect" placeholder="Arraste a imagem de capa aqui"></image-slot></div>
        <div style="display:flex;padding-top:var(--space-2)"><button class="btn btn-primary" style="font-size:17px;padding:14px 28px" onClick="{{ start }}">Começar</button></div>
      </div>
    </sc-if>

    <sc-if value="{{ isQuestion }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:var(--space-3)">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn-ghost" style="opacity:{{ backOpacity }};padding-left:8px;padding-right:8px" disabled="{{ backDisabled }}" onClick="{{ back }}">← voltar</button>
          <div style="flex:1;height:10px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden">
            <div style="height:100%;width:{{ progress }};background:var(--color-accent);border-radius:999px;transition:width .35s ease"></div>
          </div>
          <span style="font-size:14px;font-weight:600;min-width:40px;text-align:right">{{ qNum }}/{{ qTotal }}</span>
        </div>
        <sc-if value="{{ showQuip }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:flex-start;padding:10px 18px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-900);font-family:'Pixelify Sans',var(--font-heading);font-weight:600;font-size:18px">{{ quip }}</div>
        </sc-if>
        <sc-for list="{{ qSlots }}" as="s" hint-placeholder-count="1">
          <sc-if value="{{ s.show }}" hint-placeholder-val="{{ false }}">
            <div style="width:100%;aspect-ratio:16/7;border-radius:calc(var(--radius-lg) * 1.15);overflow:hidden;background:{{ s.bg }}"><image-slot id="pergunta-{{ s.n }}" src="{{ s.img }}" fit="{{ s.fit }}" shape="rect" placeholder="Imagem da pergunta {{ s.n }}"></image-slot></div>
          </sc-if>
        </sc-for>
        <h2 style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:clamp(24px,5vw,36px);line-height:1.15;margin:0;text-wrap:pretty">{{ q.text }}</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="8">
            <button onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:12px;text-align:left;padding:12px 16px 12px 12px;min-height:52px;border-radius:26px;border:2px solid {{ o.border }};background:{{ o.bg }};color:var(--color-text);font:inherit;font-size:clamp(15px,3.6vw,16px);line-height:1.35;cursor:pointer;transition:background .15s,border-color .15s" style-hover="border-color:var(--color-accent-400)">
              <span style="flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:{{ o.dotBg }};color:{{ o.dotFg }}">{{ o.letter }}</span>
              <span>{{ o.text }}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{ showNext }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" style="font-size:17px;padding:14px 28px" disabled="{{ nextDisabled }}" onClick="{{ next }}">{{ nextLabel }}</button></div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--space-3);padding:var(--space-5) 0;text-align:center">
        <img src="assets/carregando.jpg" alt="pensano" style="width:220px;height:220px;object-fit:cover;border-radius:calc(var(--radius-lg) * 1.15);box-shadow:var(--shadow-md)">
        <div style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1">descobrindo seu mob…</div>
        <div style="width:100%;max-width:360px;height:12px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden">
          <div style="height:100%;width:{{ loadPct }};background:var(--color-accent);border-radius:999px;transition:width .12s linear"></div>
        </div>
        <div style="font-size:16px;color:var(--color-neutral-700)">{{ loadMsg }}</div>
      </div>
    </sc-if>

    <sc-if value="{{ isResult }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;gap:var(--space-4)">
        <div style="display:flex;flex-direction:column;gap:var(--space-2)">
          <div style="align-self:flex-start;max-width:100%;box-sizing:border-box;padding:8px 16px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-900);font-family:'Pixelify Sans',var(--font-heading);font-weight:600;font-size:16px;line-height:1.3;text-wrap:pretty">{{ endQuip }}</div>
          <div style="display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap">
            <sc-for list="{{ mobSlots }}" as="m" hint-placeholder-count="1">
              <sc-if value="{{ m.show }}" hint-placeholder-val="{{ false }}">
                <div style="width:160px;height:200px;border-radius:calc(var(--radius-lg) * 1.15);background:{{ m.bg }};overflow:hidden;box-shadow:var(--shadow-md)"><image-slot id="mob-{{ m.key }}" src="{{ m.img }}" fit="contain" shape="rect" placeholder="Imagem do mob"></image-slot></div>
              </sc-if>
            </sc-for>
            <div style="display:flex;flex-direction:column;gap:4px">
              <span style="font-size:15px;color:var(--color-accent-700);font-weight:600">você é…</span>
              <h1 style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:clamp(40px,9vw,64px);line-height:1;margin:0">{{ result.name }}</h1>
              <button class="btn btn-ghost" style="align-self:flex-start;font-size:13px;padding:6px 10px" onClick="{{ toggleMusic }}">{{ musicLabel }}</button>
            </div>
          </div>
        </div>
        <div class="card elev-md" style="padding:clamp(18px,4vw,var(--space-4));gap:var(--space-2)">
          <div style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:22px">{{ result.tagline }}</div>
          <p style="margin:0;font-size:17px;line-height:1.55;text-wrap:pretty">{{ result.desc }}</p>
        </div>
        <sc-if value="{{ showBreakdown }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="font-family:'Pixelify Sans',var(--font-heading);font-weight:700;font-size:20px">seu DNA de mob</div>
            <sc-for list="{{ breakdown }}" as="b" hint-placeholder-count="8">
              <div style="display:grid;grid-template-columns:36px minmax(0,110px) minmax(0,1fr) 40px;align-items:center;gap:10px;font-size:14px">
                <div style="width:36px;height:36px;border-radius:50%;background:{{ b.dotBg }} url('{{ b.img }}') center/70% no-repeat"></div>
                <span style="font-weight:600">{{ b.name }}</span>
                <div style="height:12px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden"><div style="height:100%;width:{{ b.pct }};background:{{ b.color }};border-radius:999px"></div></div>
                <span style="text-align:right">{{ b.pct }}</span>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary" style="flex:1 1 100%;font-size:17px;padding:14px 28px" disabled="{{ shareDisabled }}" onClick="{{ share }}">{{ shareLabel }}</button>
          <sc-if value="{{ showFallback }}" hint-placeholder-val="{{ false }}">
            <div style="flex:1 1 100%;font-size:14px;color:var(--color-neutral-700)">{{ shareMsg }}</div>
          </sc-if>
          <button class="btn btn-secondary" style="flex:1 1 160px" onClick="{{ copyLink }}">{{ copyLabel }}</button>
          <button class="btn btn-secondary" style="flex:1 1 160px" onClick="{{ saveImg }}">{{ imgLabel }}</button>
          <button class="btn btn-ghost" style="flex:1 1 120px" onClick="{{ restart }}">refazer</button>
        </div>
      </div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;suspense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;questionImages&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showBreakdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
const L = ['A','B','C','D','E','F','G','H'];
const MOBS = [
  { name:"Enderman", key:'enderman', img:'assets/mobs/enderman.png', tagline:"o misterioso", desc:"você não odeia pessoas, só prefere que elas fiquem longe. é misterioso, não olha muito nos olhos, não gosta de ser incomodado e se alguém mexer nas suas coisas pode considerar uma ameaça de guerra. inclusive, tomar banho não parece estar nos seus planos." },
  { name:"Creeper", key:'creeper', img:'assets/mobs/creeper.png', tagline:"o pavio curto", desc:"você parece tranquilo até não ser mais. guarda tudo, acumula estresse e uma hora simplesmente EXPLODE, totalmente imprevisível. depois fica pensando se exagerou, mas também não vai pedir desculpas pq não perde a razão. terapia vai ter assunto novo." },
  { name:"Golem de Ferro", key:'iron-golem', img:'assets/mobs/iron-golem.png', tagline:"o protetor", desc:"você tem aquela personalidade de quem não demonstra muito, mas se importa pra caramba. protetor, leal e meio difícil de conquistar. não fala muito sobre sentimentos, prefere demonstrar com atitudes. está sempre de olho em quem gosta e não costuma abandonar ninguém. mexeu com alguém importante pra você? aí o negócio fica sério. basicamente um segurança particular com sentimentos." },
  { name:"Villager", key:'villager', img:'assets/mobs/villager.png', tagline:"o negociador", desc:"você é meio peculiar, tem seus próprios hábitos e provavelmente repete as mesmas coisas todos os dias. gosta de conforto, rotina e de ficar no seu cantinho. quando alguém te pede alguma coisa, sua primeira reação é fazer aquele famoso \"hmmmm\". é meio desconfiado, negocia até o que não precisa e sempre tenta sair ganhando. personalidade questionável, mas pelo menos sabe fazer negócios." },
  { name:"Bruxa", key:'bruxa', img:'assets/mobs/bruxa.png', tagline:"a espertinha", desc:"você é fofoqueiro? talvez. julgador? com certeza. tem uma opinião sobre absolutamente tudo e provavelmente já criou umas 15 teorias sobre alguém que viu por cinco segundos. não perde uma fofoca. serviu investigação." },
  { name:"Aranha", key:'aranha', img:'assets/mobs/aranha.png', tagline:"a observadora", desc:"você gosta de ficar na sua, mas quando alguém te incomoda, mostra que não é tão inofensivo assim. tem uma energia meio misteriosa, aparece quando ninguém espera e provavelmente assusta as pessoas sem nem tentar. mas não se engane: se te vê, já parte pro ataque. aparentemente, diplomacia não é seu forte. socialmente duvidoso, mas estiloso." },
  { name:"Ghast", key:'ghast', img:'assets/mobs/ghast.png', tagline:"o dramático", desc:"você é dramático num nível preocupante. qualquer inconveniência vira o fim do mundo e qualquer situação constrangedora fica sendo lembrada durante os próximos 8 anos. provavelmente já criou diálogos imaginários que nunca vão acontecer. forças, guerreiro, segura a cabeça senão a coroa cai, porque tá difícil." },
  { name:"Zumbi", key:'zumbi', img:'assets/mobs/zumbi.png', tagline:"o desligado", desc:"você vive no automático, parece que está presente fisicamente, mas mentalmente já foi de arrasta. demora pra processar as coisas, acorda cansado e provavelmente precisa de umas 14 horas de sono. sua energia social está sempre em 2%. mas uma coisa é certa: você não desiste fácil. pode demorar uma eternidade, pode levar mil tombos, mas continua indo atrás do que quer. persistência ou teimosia? fica aí o questionamento." },
  { name:"Gato", key:'gato', img:'assets/mobs/gato.png', tagline:"o independente", desc:"você simplesmente não nasceu pra socializar. gosta de carinho, mas só quando VOCÊ quer. demora pra responder, some do nada e depois aparece como se nada tivesse acontecido. tem problemas sérios com demonstrações de afeto, mas tudo bem, divou na arte de ser inacessível." },
  { name:"Raposa", key:'raposa', img:'assets/mobs/raposa.png', tagline:"o astuto", desc:"você é literalmente a pessoa mais desconfiada do ambiente. é esperta, observa tudo, inclusive detalhes despercebidos, duvida de todos e ainda finge que não está nem aí. parece que nasceu pra investigar a vida alheia. serviu FBI." },
  { name:"Axolote", key:'axolote', img:'assets/mobs/axolote.png', tagline:"o tranquilo", desc:"você é literalmente um neném. gosta de carinho, atenção e provavelmente ficaria feliz se alguém te desse um presentinho aleatório. meio emocionado, meio bobinho e facilmente conquistado por pequenas demonstrações de afeto. serviu fofura." },
  { name:"Lobo", key:'lobo', img:'assets/mobs/lobo.png', tagline:"o fiel", desc:"você é aquele tipo de pessoa que fala que não liga, mas liga SIM. extremamente apegado a quem gosta, um pouco ciumento e provavelmente capaz de cometer pequenos crimes pelos amigos. lealdade é tudo, mas cuidado com esse apego." },
  { name:"Allay", key:'allay', img:'assets/mobs/allay.png', tagline:"o prestativo", desc:"você tem dois neurônios e os dois estão de férias. vive distraído, esquece o que estava fazendo no meio da tarefa e provavelmente se perderia dentro da própria casa. não tankei essa personalidade, mas pelo menos é um amorzinho." },
  { name:"Esqueleto", key:'esqueleto', img:'assets/mobs/esqueleto.png', tagline:"o frio e calculista", desc:"você tem a personalidade de quem responde kkkk sem ter achado graça nenhuma. vive no deboche, não sabe demonstrar sentimentos e tem um humor duvidoso que provavelmente faria você ser cancelado em algum grupo. simplesmente não tem filtro. serviu entretenimento." },
  { name:"Panda", key:'panda', img:'assets/mobs/panda.jpg', dark:true, tagline:"o preguiçoso", desc:"você só quer comer, dormir e não ser incomodado. tem seus momentos de fofura, mas também consegue ser extremamente preguiçoso. provavelmente cancelaria todos os compromissos só pra ficar deitado. prioridades, né." },
  { name:"Slime", key:'slime', img:'assets/mobs/slime.png', tagline:"o brincalhão", desc:"você é meio bobinho, divertido e parece que nunca amadureceu completamente. consegue transformar qualquer situação em brincadeira e provavelmente ri de coisas que nem têm graça. mas, mesmo quando tentam te derrubar, você volta. simplesmente impossível de eliminar." },
  { name:"Lhama", key:'lhama', img:'assets/mobs/lhama.png', tagline:"o debochado", desc:"você tem uma personalidade forte e não faz muita questão de agradar todo mundo. seu olhar já entrega o que está pensando, mesmo quando você não fala absolutamente nada. gosta do seu espaço, tem suas próprias opiniões e não leva desaforo pra casa. às vezes pode parecer meio difícil de lidar, mas quem convive com você sabe que também tem seu lado divertido. seu talento especial? cuspir desaforo sem nem precisar abrir a boca direito." },
  { name:"Piglin", key:'piglin', img:'assets/mobs/piglin.png', tagline:"o interesseiro", desc:"você é meio interesseiro? talvez. gosta de receber alguma coisa em troca e dificilmente faz algo de graça. tem seus próprios critérios pra confiar nas pessoas e, se alguém aparece sem oferecer nada, já começa a olhar torto. mas dê ouro e você ganha um amigo. amizade comprada? não vamos entrar nesse assunto." },

const Q = [["Você acabou de entrar em um mundo novo no Minecraft. Qual é sua primeira reação?",["Sai andando sem rumo e, quando percebe, já está longe de todo mundo.","Vai atrás de recursos pra causar o caos. Construir uma casa fica pra depois.","Já começa a organizar tudo. Alguém precisa ter responsabilidade nesse lugar.","Procura uma vila. Vai que aparece uma oportunidade de fazer money.","Fica observando tudo em silêncio. A investigação começa antes mesmo de construir.","Vai atrás dos outros só pra perturbar. A paz não dura muito com você por perto.","Procura o ponto mais alto e fica contemplando a própria existência.","Já quer encontrar algum mob pra enfrentar. Mal chegou e já está procurando problema."]],
  ["Alguém mexeu nas suas coisas sem pedir. O que você faz?",["Some sem dar explicação. Boa sorte tentando te encontrar.","Fica com uma raiva absurda. Quem foi o querido que fez isso?","Não fala muita coisa, mas mexeu de novo pra você ver.","Quer saber quanto a pessoa vai pagar pelo prejuízo.","Finge que não viu, mas já está planejando alguma coisa.","Solta uma indireta e sai andando como se nada tivesse acontecido.","Faz um escândalo. O mundo precisa saber dessa injustiça.","Vai lá e pega de volta. Sem muita cerimônia."]],
  ["Qual desses lugares combina mais com você?",["Um lugar isolado, escuro e onde ninguém fique te incomodando.","Um ambiente caótico, cheio de perigo e com grandes chances de dar errado.","Uma floresta bonita ou uma montanha gelada. Um pouco de paz, por favor.","Uma vila tranquila, com comida, plantações e oportunidades de negócio.","Um pântano misterioso. Tem seu charme, não julgue.","Uma caverna escura, cheia de lugares pra explorar e escalar.","O Nether. Aparentemente, você gosta de viver no limite.","Qualquer lugar serve, desde que tenha espaço pra andar sem ser incomodado."]],
  ["No seu grupo de amigos, você costuma ser quem?",["Some por dias e depois volta como se nada tivesse acontecido.","Faz alguma coisa questionável e ainda acha graça.","Protege todo mundo, mesmo quando ninguém pediu.","Resolve os problemas e tenta impedir que o grupo vire um circo.","Perturba quem está muito quietinho. Alguém precisa movimentar as coisas.","Sabe de tudo que acontece. A central de fofocas tem um representante.","Faz um drama por qualquer coisa. E às vezes com razão.","Não desiste dos amigos, mesmo quando eles testam sua paciência."]],

      const MAXW = W - 260, FOOT = 1690;

      let y = 1110;

  shareSupport() {

    const f = this.storyFile;
    let data = d;
